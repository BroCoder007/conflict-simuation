spring.application.name=ConflictAtlas
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:NONE}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=64KB
spring.threads.virtual.enabled=true
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/conflict-atlas;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.h2.console.enabled=false
spring.web.resources.cache.use-last-modified=false
atlas.live-data=${LIVE_DATA:true}
